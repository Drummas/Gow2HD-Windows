# Creates a GitHub release when a pushed commit message follows this convention, using
# https://github.com/marketplace/actions/auto-release, then builds the launcher on a Windows runner and attaches
# Gow2HD-Windows.exe and its .sha256 to that release. Release notes come from CHANGELOG.md.
#
# Convention -- the release commit's subject starts with "Release: vX.Y.Z", for example
#
#     Release: v0.1.1
#
#     Optional body explaining the release.
#
# and CHANGELOG.md already carries a "## v0.1.1" section, which becomes the release description. Everything else,
# including an ordinary commit that merely mentions a version, publishes nothing.
#
# A manual run (Actions -> Release -> Run workflow, "publish" ticked) publishes or refreshes the release for the
# launcher version in launcher/src/config.h and then builds the exe, which is also how the assets of an existing
# release are filled in without a new version.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Build and publish a release for main (unchecked: run everything except publishing)"
        type: boolean
        default: false

permissions:
  contents: write          # the tag, the release and its assets

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish
    outputs:
      released: ${{ steps.release.outputs.released || steps.manual.outputs.released }}
      tag: ${{ steps.confirm.outputs.tag || steps.manual.outputs.tag }}
    env:
      # One token for the whole job. The auto-release action reads GITHUB_TOKEN and fails with
      # "The GITHUB_TOKEN environment variable was not set" without it; the gh CLI reads the very same variable,
      # so GH_TOKEN is deliberately not set here (two names for one value is what goes stale).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Release on a Release line
        id: release
        if: github.event_name == 'push'
        uses: CupOfTea696/gh-action-auto-release@v1.0.2
        with:
          title: "Gow2HD-Windows $semver"
          tag: "v$semver"
          draft: false
          changelog: CHANGELOG.md
          changelog-entry: "$version"
          # The convention above, as a JavaScript regex in /pattern/flags form (the action requires the slashes).
          # `#{semver}` is replaced by the action's SemVer pattern and supplies $version / $semver, so this matches
          # a commit message whose first line is "Release: v1.2.3" -- case-insensitive, with or without a body.
          # `^` is anchored to the start of the message and nothing follows but whitespace or the end, so a version
          # mentioned anywhere else ("fix the v1.2.3 download link") does not publish a release.
          regex: '/^Release: #{semver}(?=\s|$)/i'

      - name: Publish on a manual run
        # The action reads the commit list of a push, which a manual run does not carry, so this path publishes with
        # the gh CLI instead: the launcher's own version, the matching CHANGELOG section, and the same tag form.
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^#define LAUNCHER_VERSION *"\(.*\)"/\1/p' launcher/src/config.h)
          if [ -z "$VER" ]; then echo "no LAUNCHER_VERSION in launcher/src/config.h"; exit 1; fi
          awk -v pat="v$VER" '/^## /{inside = index($0, pat) > 0; if (inside) next} inside' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no '## v$VER' section"; exit 1; fi
          if gh release view "v$VER" --json tagName >/dev/null 2>&1; then
            gh release edit "v$VER" --title "Gow2HD-Windows $VER" --notes-file notes.md   # exists: refresh it
          else
            gh release create "v$VER" --title "Gow2HD-Windows $VER" --notes-file notes.md
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Confirm the release with the gh CLI
        # Authenticates with the same GITHUB_TOKEN: no extra login, no GH_TOKEN. The tag it reads back is what the
        # Windows job attaches the exe to.
        id: confirm
        if: steps.release.outputs.released == 'true'
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.id }}" --jq .tag_name)
          echo "released $TAG -> https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: publish
    if: needs.publish.outputs.released == 'true'
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # gh release upload, same single variable as above
    steps:
      - uses: actions/checkout@v4

      - name: Download the pinned llvm-mingw
        # The same toolchain build.py downloads for players, taken from its own list so the version and the SHA-256
        # stay pinned in one place. build.cmd looks for the llvm-mingw-* folder inside this one.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tools = (python build.py --print-tools | Out-String) | ConvertFrom-Json
          $t = $tools | Where-Object { $_.name -eq 'llvm-mingw' }
          if (-not $t) { throw 'build.py --print-tools does not list llvm-mingw' }
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Write-Host "downloading $($t.url) ($($t.size) bytes)"
          Invoke-WebRequest -Uri $t.url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $t.sha256) { throw "sha256 mismatch for $($t.url): $hash" }
          $dest = Join-Path $env:GITHUB_WORKSPACE ("tools-download\" + $t.'extract-to')
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          Get-ChildItem $dest | Select-Object -First 3 -ExpandProperty Name

      - name: Build the launcher
        # build.cmd packs the build sources into the exe (bundled mode: one download, works offline) and writes
        # build\Gow2HD-Windows.exe plus build\Gow2HD-Windows.exe.sha256 next to it.
        shell: cmd
        run: launcher\build.cmd release
        env:
          LLVM_MINGW: ${{ github.workspace }}\tools-download\llvm-mingw
          PYTHON: python

      - name: Check the built files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('Gow2HD-Windows.exe', 'Gow2HD-Windows.exe.sha256')) {
            $p = Join-Path 'launcher\build' $f
            if (-not (Test-Path $p)) { throw "missing $p" }
            Write-Host "$p  $((Get-Item $p).Length) bytes"
          }
          Get-Content launcher\build\Gow2HD-Windows.exe.sha256

      - name: Scan the artifacts for personal paths
        # The release check documented in launcher/NOTES.md: fails on any personal path or user name in the files.
        shell: pwsh
        run: |
          python launcher\tools\scan_private.py launcher\build\Gow2HD-Windows.exe launcher\build\Gow2HD-Windows-scripts-src.zip
          if ($LASTEXITCODE -ne 0) { throw 'scan_private.py reported a hit' }

      - name: Attach the exe and its checksum to the release
        shell: pwsh
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TAG) { throw 'the publish job did not report a release tag' }
          gh release upload $env:TAG launcher\build\Gow2HD-Windows.exe launcher\build\Gow2HD-Windows.exe.sha256 --clobber
          gh release view $env:TAG --json tagName,url,assets --jq '"assets of " + .tagName + ": " + ([.assets[].name] | join(", "))'
